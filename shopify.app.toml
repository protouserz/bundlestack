# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "4aade1f433c3c5bd867c99cce348cede"
name = "BundleStack"
application_url = "https://bundlestack-pfee.onrender.com"
embedded = true
handle = "bundlestack"

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/subscriptions_update"
  topics = [ "app_subscriptions/update" ]

[access_scopes]
# Least privilege for Built for Shopify / App Store distribution.
# Quantity breaks only need product reads and discount Function writes.
# Do not add order or customer-account scopes unless that surface is shipped
# (those scopes also filter install eligibility).
scopes = "read_discounts,read_products,write_discounts"

[access.admin]
embedded_app_direct_api_access = true
direct_api_mode = "offline"

[pos]
embedded = false

[auth]
redirect_urls = [
  "https://bundlestack-pfee.onrender.com/auth/callback",
  "https://bundlestack-pfee.onrender.com/auth/shopify/callback"
]

[app_proxy]
url = "https://bundlestack-pfee.onrender.com/app-proxy"
subpath = "bundlestack"
prefix = "apps"
